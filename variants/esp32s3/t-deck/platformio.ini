; LilyGo T-Deck
[env:t-deck]
custom_meshtastic_hw_model = 50
custom_meshtastic_hw_model_slug = T_DECK
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = LILYGO T-Deck
custom_meshtastic_images = t-deck.svg
custom_meshtastic_tags = LilyGo
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB
custom_meshtastic_has_mui = true

extends = esp32s3_base
board_level = release
board = t-deck
board_build.partitions = default_16MB.csv
upload_protocol = esptool

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/t-deck>

build_flags = ${esp32s3_base.build_flags} 
  -D T_DECK 
  -D BOARD_HAS_PSRAM
  -I variants/esp32s3/t-deck

lib_deps = ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.28
  # renovate: datasource=git-refs depName=ESP8266Audio packageName=https://github.com/meshtastic/ESP8266Audio gitBranch=meshtastic-2.0.0-dacfix
  https://github.com/meshtastic/ESP8266Audio/archive/343024632ee78d6216907b2353fc943a62422d80.zip
  # renovate: datasource=custom.pio depName=ESP8266SAM packageName=earlephilhower/library/ESP8266SAM
  earlephilhower/ESP8266SAM@1.1.0

[env:t-deck-tft]
extends = env:t-deck
board_level = pr

extra_scripts =
  ${env:t-deck.extra_scripts}
  extra_scripts/ld_response_file.py

build_flags =
  ${env:t-deck.build_flags}
  -D CONFIG_DISABLE_HAL_LOCKS=1 ; "feels" to be a bit more stable without locks
  -D INPUTDRIVER_I2C_KBD_TYPE=0x55
  -D INPUTDRIVER_ENCODER_TYPE=3
  -D INPUTDRIVER_ENCODER_LEFT=1
  -D INPUTDRIVER_ENCODER_RIGHT=2
  -D INPUTDRIVER_ENCODER_UP=3
  -D INPUTDRIVER_ENCODER_DOWN=15
  -D INPUTDRIVER_ENCODER_BTN=0
  -D INPUTDRIVER_BUTTON_TYPE=0
  -D HAS_SDCARD
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D USE_I2S_BUZZER
  -D RAM_SIZE=5120
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D RADIOLIB_DEBUG_BASIC=0
  -D RADIOLIB_DEBUG_SPI=0
  -D RADIOLIB_DEBUG_PROTOCOL=0
  -D RADIOLIB_SPI_PARANOID=0
  -D CALIBRATE_TOUCH=0
  -D LGFX_SCREEN_WIDTH=240
  -D LGFX_SCREEN_HEIGHT=320
  -D LGFX_BUFSIZE=153600
  -D DISPLAY_SIZE=320x240 ; landscape mode
  -D LGFX_DRIVER=LGFX_TDECK
  -D GFX_DRIVER_INC=\"graphics/LGFX/LGFX_T_DECK.h\"
;  -D LVGL_DRIVER=LVGL_TDECK
;  -D GFX_DRIVER_INC=\"graphics/LVGL/LVGL_T_DECK.h\"
;  -D LV_USE_ST7789=1
  -D VIEW_320x240
  -D USE_PACKET_API
  -D MAP_FULL_REDRAW
;  -D CUSTOM_TOUCH_DRIVER

lib_deps =
  ${env:t-deck.lib_deps}
  ${device-ui_base.lib_deps}
  ;https://github.com/bitbank2/bb_captouch/archive/refs/tags/1.3.1.zip

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}

; Meshtastic with MeshCore beside it on the one radio: src/modules/MeshCoreModule.cpp, src/mesh/SideChannel.h and
; lib/MeshCore (the MeshCore companion firmware, hosted)
[env:t-deck-tft-meshcore]
extends = env:t-deck-tft

build_flags =
  ${env:t-deck-tft.build_flags}
  -D MESHCORE_COEXIST=1
  ; Factory defaults (first boot or factory reset) for where this build is used, Norway: the narrow EU plan with
  ; NarrowFast (slot 1 = 869.44165 MHz), beside MeshCore's EU/UK Narrow settings in lib/MeshCore/library.json.
  ; Elsewhere: change these two and the LORA_ values there. Same effect as the entries of that name in userPrefs.jsonc.
  -D USERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_EU_N_868
  -D USERPREFS_LORACONFIG_MODEM_PRESET=meshtastic_Config_LoRaConfig_ModemPreset_NARROW_FAST
  ; -D MESHCORE_TCP_PORT=0 ; no MeshCore app link over Wi-Fi (default 5000)
  -D TRACKBALL_POINTER=1 ; the trackball moves an arrow and clicks (src/graphics/TrackballPointer.cpp)

lib_deps =
  ${env:t-deck-tft.lib_deps}
  # renovate: datasource=custom.pio depName=CayenneLPP packageName=electroniccats/library/CayenneLPP
  electroniccats/CayenneLPP@1.6.1
  # renovate: datasource=custom.pio depName=base64 packageName=densaugeo/library/base64
  densaugeo/base64@1.4.0
